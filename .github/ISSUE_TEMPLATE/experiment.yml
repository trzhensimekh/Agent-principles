name: Report an experiment or counterexample
description: Contribute reproducible evidence for or against an AGENT mechanism.
title: "[Evidence] "
body:
  - type: textarea
    id: claim
    attributes:
      label: Claim under test
      description: Identify the principle or mechanism and a result that would refute it.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Reproduction and controls
      description: Include repository revision, tasks, baseline, model/harness versions, environment, budget, and commands. Exclude credentials.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance evidence and costs
      description: Report failed runs, regressions, total costs, and links to raw artifacts. Label synthetic data explicitly.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limitations and alternative explanations
      description: What does this result fail to establish?
